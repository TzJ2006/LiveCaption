[project]
name = "livecaption-web"
version = "0.1.0"
description = "The LiveCaption web adapter, shared with Personal Agents."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
standalone = ["personal-agents[caption]>=0.1"]

[project.scripts]
livecaption-web = "livecaption_web.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["livecaption_web*"]

[tool.setuptools.package-data]
livecaption_web = ["templates/*.html"]

[tool.uv.sources]
personal-agents = { path = "../personalAgents", editable = true }
