[project]
name = "livecaption-web"
version = "0.1.0"
description = "The LiveCaption web adapter, shared with Personal Agents."
requires-python = ">=3.13"
dependencies = ["agent-runtime>=0.1,<1"]

[project.optional-dependencies]
standalone = ["numpy>=2", "sounddevice>=0.5", "pyaudiowpatch>=0.2.12", "sherpa-onnx>=1.10"]

[project.scripts]
livecaption-web = "livecaption_web.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["livecaption_web*"]

[tool.setuptools.package-data]
livecaption_web = ["templates/*.html"]

[tool.uv.sources]
agent-runtime = { path = "../../Shared/agent-runtime", editable = true }
gadget = { path = "../gadget", editable = true }
model-access = { path = "../../Shared/model-access", editable = true }
